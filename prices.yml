name: update-prices
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "update prices" && git push
